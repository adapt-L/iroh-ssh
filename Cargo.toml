[package]
name = "iroh-ssh"
description = "ssh without ip"
license = "GPL-3.0"
authors = ["Adam Pimentel <adam@adaptl.net>",  "Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/adapt-L/iroh-ssh"
readme = "README.md"
keywords = ["networking","ssh","iroh"]
categories = ["network-programming"]
version = "0.2.6"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
users = "0.11.0"
iroh = { version = "0.90.0", features = ["discovery-pkarr-dht","discovery-local-network"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8"
tokio-stream = { version = "0.1.15", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.47.1", features = [
    "macros",
    "io-util",
    "sync",
    "rt",
] }
clap = { version = "4.5.45", features = ["derive"] }
homedir = "0.3.6"
whoami = "1.6.1"
z32 = "1.3"
runas = { git = "https://github.com/adapt-L/rust-runas.git", rev = "bb6ac921ea057d169ac4609848043d1a2257f763" }
tempfile = "3.21.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
